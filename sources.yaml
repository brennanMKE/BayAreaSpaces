  - id: sequoia-fabrica
    name: Sequoia Fabrica
    city: San Francisco
    region: sf
    url: https://sequoiafabrica.org/
    sources:
      # Public classes + social nights. THE primary public calendar.
      # Prefer the real ICS once the token is pasted in; until then parse the
      # server-rendered agenda table, which is stable and needs no browser.
      - adapter: ics
        url: TODO   # webcal://feeds.bookwhen.com/ical/lcqebfpp6u7h/{TOKEN}/public.ics?historic_month_count=1
        label: bookwhen-public
        trust: 100
        verified: false
        notes: >
          Account segment lcqebfpp6u7h confirmed from the public page's
          data-options "calendar" key. TOKEN is only available from Bookwhen admin
          -> "Calendar feeds"; Brennan is a founding member, ask in Slack #events.
          Host/path shape confirmed by probing with a deliberately invalid token
          (404 text/calendar) - no live URL was ever guessed.
      - adapter: bookwhen_html
        url: https://bookwhen.com/sequoiafabrica
        label: bookwhen-agenda
        trust: 95
        verified: true
        notes: >
          20 real events, 2026-08-13 -> 2027-01-05. Fallback until the ICS token
          lands, then demote or drop. Rows are <tr data-hook="agenda_list_item">;
          data-event="ev-{entryid}-{YYYYMMDDHHMMSS}" carries the exact local start.
          Paginate via /sequoiafabrica/calendar_items only if the default 20-row
          window ever falls short of the horizon.
      - adapter: gcal_ics
        calendar_id: c_69d095340ce714f6a0769a561fa4414c07981195eb1c9be7fde47a5cdd5450a5@group.calendar.google.com
        label: community-calendar
        trust: 90
        verified: true
        notes: >
          Member/volunteer events ONLY - disjoint from Bookwhen, per the calendar's
          own X-WR-CALDESC: "For member and volunteer events (separate from
          classes/Bookwhen events)." 89 VEVENTs back to Dec 2023 but only ~7 live
          in a 120-day horizon, 6 of them open-ended monthly RRULEs. Expand and
          clip to horizon. Mixed DTSTART forms (bare UTC Z and TZID=) both occur.
    # Dead end: events.sequoiafabrica.org looks like a real events site but every
    # path (/events.ics, /feed, /ical) 200s as a redirect to Bookwhen.
