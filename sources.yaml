      - adapter: json
        url: https://storage.googleapis.com/makernexus_amilia_activities_cache/events.json
        label: amilia-community-events-cache
        trust: 90
        verified: true
        notes: >
          Undocumented public cache. 30 forward-looking community events,
          Last-Modified same day. Dict keyed "YYYY-MM-DD_<amiliaId>" - use the key
