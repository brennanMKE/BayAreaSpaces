    region: south-bay
    url: https://www.makernexus.org/
    sources:
      - adapter: gcal_ics
        calendar_id: c_dd13e6622c96fb917233442f8d9b9fc23848858063c36902f15d077b772bbd82@group.calendar.google.com
        label: amilia-published-classes
        trust: 100
