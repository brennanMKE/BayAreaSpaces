# Bay Area makerspace event source registry
#
# Every `verified: true` source below was fetched and confirmed on 2026-08-05.
# Per-space research notes, dead ends and contacts live in spaces/<id>.md.
# Never guess a feed URL: a wrong one fails silently as an empty calendar.
#
# adapter values:
#   ics            direct iCalendar feed
#   gcal_ics       Google Calendar public basic.ics (needs calendar_id)
#   tribe_rest     The Events Calendar WP REST API
#   jsonld         parse schema.org/Event from embedded <script type=application/ld+json>
#   nextdata       parse __NEXT_DATA__ blob (Eventbrite organizer pages)
#   embedded_json  named <script type="application/json" id=...> blob in a
#                  server-rendered page, plus a field map. Generalizes nextdata
#                  (which is nextdata with script_id hardcoded); nextdata could
#                  be reimplemented on top of it later. Needs `script_id`.
#   json           plain JSON document with a bespoke shape + field mapping
#   rss            RSS/Atom. Only an event source when items carry a real start
#                  date; most do not. Otherwise change-detection only.
#   bookwhen_html  server-rendered Bookwhen agenda table (deterministic, no browser)
#   llm_html       last resort: clean HTML -> local model -> JSON
#
# trust: dedupe tie-breaking. Higher wins. A space's own site always outranks
# an aggregator or a partner's calendar.
#
# enabled: false  keeps a documented source in the registry without fetching it.
#
# health: per-source overrides for the publish gates. Needed because three
# distinct "zero events" cases are not failures:
#   allow_zero          space is legitimately empty for long stretches (low volume)
#   ignore_count_drop   feed is capped or truncated, so night-over-night deltas
#                       are meaningless
#   require_nonzero_once  never yet observed non-zero; cannot have "gone to zero"
#   max_stale_days      alert if LAST-MODIFIED is older than this. Catches the
#                       abandoned-calendar-with-unbounded-RRULE case, which
#                       otherwise publishes fiction forever at a constant rate
#                       and passes every count-based gate.
#
# filters: applied after parse, before dedupe.
#   location_contains / title_contains        keep only matches
#   location_excludes / title_excludes        drop matches
#   categories_exclude                        drop by source category
#   location_allow_when_missing: true         keep events with empty/URL-only
#                                             LOCATION rather than silently
#                                             dropping them at the filter step
#
# address_override: some feeds ship a stale or absent venue. Override per space.
#
# spaceapi: whether the space publishes a SpaceAPI endpoint (https://spaceapi.io),
#   the hackerspace status standard. NOT a data source today - tracked because it
#   is the best thing to ask a space for. Its `feeds.calendar` gives {url, type},
#   `contact` gives email/mailing list, and `location` gives address + lat/lon, so
#   a space that publishes one makes its own registry entry self-maintaining: when
#   they move or switch platforms, the JSON updates and we follow automatically.
#     url / status: live | dead | none / checked: YYYY-MM-DD
#   Directory of all 249 registered spaces: https://directory.spaceapi.io/
#   Only ONE Bay Area space is registered (Sudo Room) and its endpoint is dead.
#   TRAP: the top-level `events` field is NOT calendar events - it is recent
#   occurrences in the space (door opened, member checkin). The calendar is at
#   `feeds.calendar`. Treat any directory entry as a lead requiring verification.

defaults:
  timezone: America/Los_Angeles
  # The contact is injected from the environment so it never lands in git.
  # ${MAKER_CALENDAR_CONTACT} is expanded by the config loader, which MUST fail
  # loudly when the variable is unset or still contains "example.com". Never
  # substitute a placeholder or an empty string: this header ships on every
  # request we make, and being honestly identifiable is what our robots.txt
  # position rests on (see CLAUDE.md). A run with no real contact is a bug, not
  # a degraded mode.
  # The value is an about-page URL, not an email - see .env.example. That page
  # must resolve before the first run; a UA pointing at a 404 is worse than no
  # contact, and it carries the one-email opt-out.
  user_agent: "bayarea-maker-calendar/0.1 (+${MAKER_CALENDAR_CONTACT})"
  rate_limit_seconds: 2
  horizon_days: 120

spaces:

  # ---------------------------------------------------------------- east bay

  - id: ace-makerspace
    name: Ace Makerspace
    city: Oakland
    region: east-bay
    url: https://www.acemakerspace.org/
    rate_limit_seconds: 10   # robots.txt sets Crawl-delay: 10, above the global default
    sources:
      - adapter: tribe_rest
        url: https://www.acemakerspace.org/wp-json/tribe/events/v1/events
        params: { per_page: 50 }
        label: tribe-rest
        trust: 100
        verified: true
        notes: >
          92 upcoming events over 2 pages. Paginate on next_rest_url. Richest
          payload (cost, categories, venue, organizer, ticketed, is_virtual,
          utc_start_date). Unescape HTML entities in `cost` (e.g. "&#036;20.00").
      - adapter: ics
        url: https://www.acemakerspace.org/calendar/list/?ical=1
        label: tribe-ics-list
        trust: 90
        verified: true
        notes: >
          126 VEVENTs, byte-identical to the longer ?post_type=tribe_events&ical=1
          form. Fallback for the REST feed; do not ingest both as separate sources.
      - adapter: jsonld
        url: https://www.acemakerspace.org/calendar/
        label: calendar-jsonld
        trust: 50
        verified: true
        notes: 12 schema.org/Event objects, current page only. Third-line fallback.
    # TRAPS, verified 2026-08-05 - do not wire these up:
    #   /calendar/photo/?ical=1  -> 200, but a byte-identical copy of the FULL
    #     event list. "photo" is a TEC view name, not a category. Looks like a
    #     working per-category feed and is not one.
    #   /calendar/feed/          -> HTTP 404 with a populated 9.8 KB RSS body.
    #     A body-trusting parser ingests it; a status-checking parser drops it.
    #     Canonical events RSS is ?post_type=tribe_events&feed=rss2.
    #   luma.com/acemakers       -> NOT Ace Makerspace. Feed works (5 events) but
    #     every event is an unrelated IT-consulting sales talk.
    #
    # Cross-check only (Meetup excluded by policy; duplicates the site calendar
    # and the group says "do not RSVP here"):
    #   https://www.meetup.com/ace-makerspace/events/rss/  -> 200, 10 real events
    #
    # Category-scoped ICS if per-programme calendars are ever wanted.
    # Pattern /calendar/category/{slug}/?ical=1 ; (v) = filtering confirmed:
    #   3d-printing-events (v)   art-events              electronics-events
    #   laser-events (v)         metal-machining-events  operations-and-meetings
    #   outreach-events          social-events           textiles-events (v)
    #   workshop-events (v)

  - id: sudo-room
    name: Sudo Room
    city: Oakland
    region: east-bay
    url: https://sudoroom.org/
    address_override: "Omni Commons, 4799 Shattuck Ave, Oakland, CA 94609"
    # Both feeds ship a stale LOCATION (549 48th St, the pre-2014 address).
    spaceapi:
      url: http://api.sudoroom.org/status.json
      status: dead
      checked: 2026-08-05
      # Listed in directory.spaceapi.io - the ONLY Bay Area space that is. The
      # endpoint 302s to sudoroom.org/api/status.json and returns 404 text/html
      # (a WordPress not-found page). They believed in this enough to register and
      # it rotted. Best outreach opener on the whole list: offer to fix it and
      # point feeds.calendar at the ICS they already publish.
    sources:
      - adapter: ics
        url: https://sudoroom.org/?ical=1
        label: events-manager
        trust: 100
        verified: true
        notes: >
          WP Events Manager 7.2.3.1. 8 MB, 5057 VEVENTs pre-expanded to 2058;
          73 land in the next 120 days. Query params (scope, limit, category) are
          IGNORED - the server always returns the full body, so clamp to
          horizon_days client-side. Cache on If-Modified-Since.
        filters:
          # Feed carries cross-posted third-party events. Keep Sudo Room's own.
          categories_exclude:
            - "events happening elsewhere"
            - "noisebridge"
            - "east bay food not bombs"
            - "museum events"
            - "bike parties"
      - adapter: ics
        url: https://api.lu.ma/ics/get?entity=calendar&id=cal-bqAGiRcc3VT4oYW
        label: luma
        trust: 90
        verified: true
        notes: >
          269 VEVENTs, 19 future. Better one-off/workshop coverage and a real
          per-event URL; thinner on the recurring backbone. Some entries are
          off-site (e.g. The Box Shop) - check LOCATION before applying
          address_override.
      - adapter: rss
        url: https://sudoroom.org/events/feed/
        label: events-rss
        trust: 40
        verified: true
        notes: >
          pubDate is the EVENT START here, not the publish time. Fallback and
          change-detection only - no end time, no venue.
      - adapter: rss
        url: https://sfba.social/@sudoroom.rss
        label: mastodon
        trust: 10
        verified: true
        notes: Announcement signal, not an event feed. Links to luma.com slugs.
    # CORRECTION: there are NO Google Calendar embeds on sudoroom.org/calendar/
    # (0 hits for calendar.google.com). The colour-coded entries are
    # WP-FullCalendar category options. The two gcal_ics TODO stubs that used to
    # be here were chasing calendars that do not exist.
    #
    # Dead ends - do not re-investigate: no JSON-LD anywhere; no Tribe; wp/v2/event
    # 404s; no Meetup group; omnicommons.org/calendar -> 500 (whole /blog/ tree);
    # omnicommons.org/wiki/Calendar is a governance-minutes archive current to
    # 2025-08, not an events source.
    #
    # HIGH-LEVERAGE LEAD: the "Omni Commons General Calendar" on
    # sudoroom.org/calendar/ is an Airtable embed (shrxXjo869sxBzHmr, view
    # viwJFaj6nFsS1poak). Data endpoints are walled, but Airtable supports native
    # iCal sync - so this is a request, not code. Ask
    # commons@lists.omnicommons.org (Commons Working Group, meets 2nd & 4th Mon).
    # One toggle would cover every Omni collective including Counter Culture Labs,
    # which currently has no feed at all.

  - id: the-crucible
    name: The Crucible
    city: Oakland
    region: east-bay
    url: https://www.thecrucible.org/
    address_override: "1260 7th St, Oakland, CA 94607"
    # MANDATORY: the class catalog carries no location field of any kind.
    sources:
      - adapter: embedded_json
        url: https://www.thecrucible.org/course-search/
        script_id: ac-course-data
        label: course-catalog-blob
        trust: 100
        verified: true
        notes: >
          132 KB <script id="ac-course-data" type="application/json"> blob.
          216 courses, 478 offerings, 271 inside 120 days. start_dates[] are
          Unix epoch SECONDS, local America/Los_Angeles; decoding verified
          against the product page's Class.Date attribute to the minute.
          UID: {id}:{start_epoch}.
          Each start_date is one RUN of a course, not one meeting - a 5-week
          20-hour course is ONE entry, which is what a merged calendar wants.
          Do NOT compute DTEND from `hours` (total course hours, not session
          length) or you render 40-hour blocks.
          Skip the 9 courses with an empty start_dates array.
          /shop/ carries a byte-identical blob - do not ingest both.
          There is NO XHR endpoint and NO server-side filtering: ?department=
          and a bogus ?department=ZZZ return the identical 216-course blob.
          All filtering is client-side JS.
        # No filters required. This is the cleanest large catalog in the
        # registry: no equipment checkouts, no orientations, no private
        # rentals, no per-meeting duplication. ~68 offerings/month, comparable
        # to Ace, not a Maker Nexus firehose. Published ~4.5 months ahead.
        #
        # OPTIONAL maker-only or adult-only views. Verbatim values 2026-08-05.
        # NB the blob stores HTML entities: it is "Glass Fusing &amp; Slumping",
        # never "Glass Fusing & Slumping". Unescape before matching.
        # filters:
        #   categories_exclude: ["Bike Shop"]          # `department` field
        #   title_excludes: ["Youth "]                 # 6 of 271 in horizon
      - adapter: json
        url: https://www.thecrucible.org/wp-json/wc/store/v1/products
        params: { per_page: 100, orderby: date }
        label: woocommerce-store-api
        trust: 90
        verified: true
        notes: >
          353 products over 4 pages, 1531 pa_class-date terms, 274 inside 120
          days - independently cross-validates the blob's 271.
          CRITICAL: `orderby=date` IS REQUIRED. Without it the endpoint returns
          HTTP 200 and valid JSON with X-WP-Total: 98 - 72% of the catalog
          silently missing, covering only 40 of the blob's 216 live courses.
          Paginate on X-WP-TotalPages; page=99 returns 200 with [], not an
          error, so never paginate until-error.
          Dates: attributes[].terms[].name as "MM/DD/YY H:MM am/pm" local.
          DROP the literal sentinel "01/01/70 12:00 am" - naive %y parsing maps
          it to 2070 and it sails past every horizon check.
          Richer than the blob (description, prices, stock, permalink) but
          categories are polluted with 60+ one-off per-product categories equal
          to the class title - filter on the blob's `department`, never on this.
      - adapter: nextdata
        url: https://www.eventbrite.com/o/the-crucible-2700512180
        label: eventbrite-organizer
        trust: 70
        verified: true
        notes: >
          7 events, all "Free Crucible Tour", 2026-08-20..2026-11-19. The ONLY
          source for the free public tours and the only one carrying a location
          (primary_venue.address, with lat/long). Real start_date + start_time
          + timezone. Low volume; keep the rate limit.
      - adapter: rss
        url: https://www.thecrucible.org/category/upcoming-events/feed/
        label: public-events-seed
        trust: 20
        verified: true
        enabled: false
        health:
          allow_zero: true
        notes: >
          3 items. pubDate is the POST date, NOT the event date - dates live
          only in the title text ("(JUL 16)") and the prose body. NOT an event
          source. Correct use is as the seed list for llm_html over the linked
          /event/<slug>/ pages, the only route to the public-events programme
          (iron pours, artisan fairs, community rides). Filtering is real: a
          bogus category returns 404 with 0 items.
    # TRAPS, verified 2026-08-05 - do not wire these up:
    #   /?post_type=tribe_events&ical=1 -> 200 text/html, a rendered 1.4 MB page.
    #   /events/?ical=1                 -> 200 text/html, same page as /events/
    #     modulo 20 cachebuster lines. A byte-compare says "different"; a
    #     content-compare says "identical". Compare content.
    #   /category/<bogus>/feed/         -> 404 but Content-Type is
    #     application/rss+xml with a 1.35 MB HTML body. Here the HEADER lies -
    #     earlier traps in this registry had lying bodies.
    #   wc/store/v1/products WITHOUT orderby=date -> 200, valid JSON, 98 of 353
    #     products. The worst kind: correct-looking and quietly amputated.
    #
    # The Events Calendar is NOT INSTALLED - every wp-json/tribe/* route 404s.
    # The tribe-* class names on their pages are inert Avada compatibility CSS.
    # Do not let those class names talk anyone into a tribe_rest source.
    # No schema.org/Event anywhere. Product pages carry schema.org/Course with
    # no startDate, no offers, no hasCourseInstance - a jsonld adapter would
    # return empty forever without ever erroring.
    # Also absent: Google Calendar, Luma, Meetup, Mastodon, Bluesky, and all 15
    # arts-nonprofit booking/CRM platforms probed. Registration is in-house
    # WooCommerce; the back office looks like Salesforce.
    #
    # LEAD: ask whether Salesforce holds per-MEETING session times. The website
    # exposes only one start per multi-week run, so a 10-meeting class publishes
    # as a single event. Right default for a merged calendar, but finer data
    # exists somewhere.

  - id: lower-48
    name: Lower 48 Woodshop
    city: Oakland
    region: east-bay
    url: https://www.lower48.org/
    address_override: "1212 19th St, Oakland, CA 94607"
    health:
      allow_zero: true
    notes: >
      NO MACHINE-READABLE EVENT SOURCE EXISTS as of 2026-08-05. Verified, not
      assumed - full probe list in spaces/lower-48.md. Squarespace site with NO
      events collection (sitemap has 20 URLs, none of them events; /events,
      /calendar, /blog, /news, /workshops all 404), only @type:WebSite JSON-LD,
      zero iframes so no embedded gCal, and no Luma / Bookwhen / Sawyer / Acuity
      / Punchpass / Calendly / Ticket Tailor / Meetup anywhere. Their own
      Classes page says "Our classes are currently offered through Eventbrite" -
      that organizer page is real and parseable but has upcomingEventsTotal: 0.
      Tiny nonprofit woodturning SCHOOL, not a membership makerspace. Classes
      cap at 4 students. Volume is very low and bursty, hence allow_zero.
      CORRECTION to the discovery note: they are NOT in the NIMBY complex.
      NIMBY closed 2019-09-30 and nimbyspace.org is a parked 503. Lower 48
      started there in 2016 (the bottom of two stacked 48-ft shipping
      containers - that is where the name comes from) and has long since moved
      to 1212 19th St in West Oakland, inside an unnamed private fabrication
      building that is explicitly not open to the public. Their own /about-us
      page is stale and still describes NIMBY in the present tense.
      ROBOTS - READ BEFORE FETCHING: www.lower48.org/robots.txt gives ClaudeBot,
      anthropic-ai, GPTBot, CCBot and 21 others their own "Disallow: /" group.
      This is NOT the collapsed no-op group seen on boxshopsf.org. Settled
      2026-08-05 (see CLAUDE.md): the pipeline matches "*" and may fetch under
      its own honest user-agent, but an AI research agent IS covered by those
      disallows and must not. Separately, ?format=json / json-pretty / ical /
      page-context / main-content are Disallow'ed for EVERYONE and stay
      off-limits; ?format=rss is allowed.
    sources: []
    # --- NOTHING IS WIRED UP. Do not enable anything below without a fresh
    #     fetch returning a real, dated event, and not before the robots
    #     question above is settled. ---
    #
    # BEST LEAD. Correct URL and correct adapter, both confirmed by fetching:
    # __NEXT_DATA__ -> props.pageProps.organizer.name = "The Lower 48 Woodshop",
    # id 14103153826, 328 followers. But upcomingEventsTotal = 0 and
    # upcomingEvents = [] on 2026-08-05, confirmed twice with cache-busting.
    # A stale search-engine title claims "2 Upcoming Activities" - it is wrong.
    # Registered as nextdata, NOT jsonld: Eventbrite organizer pages no longer
    # emit JSON-LD (same correction as humanmade).
    # - adapter: nextdata
    #   url: https://www.eventbrite.com/o/the-lower-48-woodshop-14103153826
    #   label: eventbrite-organizer
    #   trust: 100
    #   verified: false
    #   enabled: false
    #   health: { require_nonzero_once: true, allow_zero: true }
    #
    # NOT EVENT SOURCES, both effectively abandoned:
    #   /press-lower48?format=rss  -> 200, 3 items, pubDate is the POST date,
    #     newest 2022-11-13. Keep only as a staleness tripwire.
    #   youtube.com/feeds/videos.xml?channel_id=UCiSXxhDgphpZdw08d4BLAyA
    #     -> 200, 12 entries, newest upload 2020-03-14.
    #
    # WHAT MUST HAPPEN FIRST, in order of leverage:
    #   1. Ask Jolie Karno (jolie@lower48.org, cc hello@lower48.org) to keep
    #      posting classes to the Eventbrite organizer above. The adapter is
    #      already proven - the page is simply empty. One reply and one
    #      scheduled class turns this space on. Ask about robots at the same
    #      time; a yes settles it for this host.
    #   2. Ask what the building at 1212 19th St is called and whether it runs
    #      a tenant-wide calendar. Same shape as the Omni Commons Airtable lead
    #      under sudo-room, and potentially worth several spaces.
    #   3. Subscribe to the site newsletter (footer form on every page).
    #   4. Failing all that, DM @lower48woodshop on Instagram - the only channel
    #      with 2026 activity (last post 2026-02-14).
    #
    # Dead ends - do not re-investigate (all fetched 2026-08-05): lower48.org
    # 301s to www; /?format=rss and /classes-lower48?format=rss -> 400 (pages,
    # not collections); lu.ma/lower48{,woodshop} 404; bookwhen.com/lower48 404;
    # meetup.com/lower48{,woodshop} 404; Bluesky and Mastodon handles 404;
    # x.com/lower48woodshop 404 though still advertised on their Eventbrite
    # profile; nimbyspace.org all paths -> 503 parking shim.
    # ?format=ical deliberately NOT tested - robots.txt disallows it.
    # Blocked, never read: Yelp (403), every.org (429), Etsy (403), Wayback CDX.

