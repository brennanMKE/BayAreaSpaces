<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sequoia Fabrica</title>
</head>
<body class="bookwhen">
<!-- A Bookwhen agenda that rendered and has nothing on it.

     Never observed live - Sequoia Fabrica's page has had events on it every
     time anyone has looked - so the empty-state hook is the honest half of a
     guess. The direction of the guess is what matters: an explicit marker is
     believed and reported as a zero the page declared (ok, reported_empty),
     while a page with no rows and no marker is a reported NO_ROWS problem. The
     conservative reading is the one that cannot silently delete a space. -->
<div id="header" data-hook="page_header"><h1>Sequoia Fabrica</h1></div>

<div id="calendar"
     data-hook="calendar_container"
     data-options='{"calendar":"lcqebfpp6u7h","locale":"en","tz":"America/Los_Angeles","view":"agenda"}'>
  <table class="agenda" data-hook="agenda_list">
    <thead data-hook="agenda_list_header">
      <tr><th>Date</th><th>Time</th><th>Event</th><th></th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <p class="agenda__empty" data-hook="agenda_list_empty">
    There are no events scheduled at the moment.
  </p>
</div>

<div id="footer" data-hook="page_footer"><p>Powered by Bookwhen</p></div>
</body>
</html>
