<!DOCTYPE html>
<!--
  Trimmed copy of https://www.acemakerspace.org/calendar/ as surveyed 2026-08-05.
  The live page carries 12 schema.org/Event objects in one ld+json block; three
  are kept here, and the WebSite block that sits in front of them is kept too —
  it is the reason "collect every block, not just the first" is a requirement
  rather than a preference. Dates are verbatim, including the -07:00 offsets.
-->
<html lang="en">
<head>
  <title>Calendar &#8211; Ace Makerspace</title>
  <meta name="tec-api-version" content="v1">

  <script type="application/ld+json">

    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Ace Makerspace",
    "url": "https://www.acemakerspace.org/"
  }
  </script>

  <script type="application/ld+json">

    {
      "@context": "https://schema.org",

      "url": "https://www.acemakerspace.org/event/laser-cutter-basics-2026-08-06/",
      "startDate": "2026-08-06T18:00:00-07:00",
      "endDate": "2026-08-06T21:00:00-07:00",
      "eventStatus": "https://schema.org/EventScheduled",
      "keywords": ["Laser", "Workshop"],
      "organizer": { "@type": "Organization", "name": "Laser Team" },
      "location": {
        "@type": "Place",
        "name": "Ace Makerspace Suite 214",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "6050 Lowell Street, Suite #214",
          "addressLocality": "Oakland",
          "addressRegion": "CA",
          "postalCode": "94608"
        }
      },
      "offers": {
        "@type": "Offer",
        "price": "20.00",
        "priceCurrency": "USD",
        "url": "https://www.acemakerspace.org/event/laser-cutter-basics-2026-08-06/"
      }
    },
    {
      "@context": "https://schema.org",
      "@type": "Event",

      "@context": "https://schema.org",

      "name": "Annual Open House",

      "endDate": "2027-06-13",
      "location": { "@type": "Place", "name": "Ace Makerspace" }
    }

</head>
<body>
