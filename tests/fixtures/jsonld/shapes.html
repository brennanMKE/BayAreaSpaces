<!DOCTYPE html>
<!--
  Every JSON-LD shape this project has to survive, on one page:

    block 1  a bare array (extruct flattens this one)
    block 2  @graph nesting (it does not)
    block 3  ItemList / ListItem wrapping (it does not)
    block 4  "@type": ["Event", "EducationEvent"] - a list, as Eventbrite
             event pages emit - and an Event nested under another event's
             location, which must NOT be counted a second time
    block 5  a truncated block. extruct raises on this one, and a single
             extract() over the whole document would lose all four good blocks
             above with it.
-->
<html lang="en">
<head>
  <script type="application/ld+json">
  [
    {"@context": "https://schema.org", "@type": "Event", "name": "Bare Array One",
     "startDate": "2026-08-10T10:00:00-0700"},
    {"@type": "Event", "name": "Bare Array Two", "startDate": "2026-08-11T10:00:00-0700"}
  ]
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {"@type": "WebPage", "name": "Events"},
      {"@type": "Event", "name": "Graph Event", "startDate": "2026-08-12T19:30:00-0700",
       "endDate": "2026-08-12T22:00:00-0700"}
    ]
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "itemListElement": [
      {"@type": "ListItem", "position": 1,
       "item": {"@type": "EducationEvent", "name": "List Item Class",
                "startDate": "2026-08-13T09:00:00-0700"}},
      {"@type": "ListItem", "position": 2,
       "item": {"@type": "Event", "name": "List Item Social",
                "startDate": "2026-08-14T17:00:00-0700"}}
    ]
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": ["Event", "EducationEvent"],
    "name": "Typed As A List",
    "startDate": "2026-08-15T13:00:00-0700",
    "location": {
      "@type": "Place",
      "name": "Somewhere",
      "event": {"@type": "Event", "name": "Nested Under Location",
                "startDate": "2026-08-16T13:00:00-0700"}
    }
  }
  </script>

  <script type="application/ld+json">
  {"@type": "Event", "name": "Truncated", "startDate":
  </script>
</head>
<body></body>
</html>
